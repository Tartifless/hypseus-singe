name: CMake-Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: true
        default: 'v3.0.2'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@master
        with:
          repository: DirtBagXon/hypseus-singe
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-image
            mingw-w64-x86_64-sdl3-mixer
            mingw-w64-x86_64-sdl3-ttf
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            git

      - name: Create Build SHA
        run: |
          ShortSHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHORT_SHA=$ShortSHA" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          sed -i \
          's/set(VER_TAG "${VER_TAG}-dirty")/set(VER_TAG "${VER_TAG}-${{ env.COMMIT_SHORT_SHA }}")/' \
          src/CMakeLists.txt
          # Console build (same as upstream)
          cmake -G "MSYS Makefiles" -S src -B build
          # Windows subsystem build: no console window
          cmake -G "MSYS Makefiles" -S src -B build-noconsole -DCMAKE_EXE_LINKER_FLAGS="-mwindows"

      - name: Build
        run: |
          make -C build
          make -C build-noconsole

      - name: Add DLLs
        run: |
          for dir in build build-noconsole; do
            (
              cd "$dir"
              ntldd -R hypseus.exe |
                awk '/mingw64/ {print $3}' |
                while read -r dll; do
                  cp -u "$dll" .
                done
            )
          done

      - name: Add data folders
        run: |
          for dir in build build-noconsole; do
            cp -r fonts pics sound midi "$dir/"
            cp doc/hypinput.ini "$dir/"
          done

      - name: Upload console build
        uses: actions/upload-artifact@v6
        with:
          name: hypseus-windows-console
          path: |
            build/hypseus.exe
            build/*.dll
            build/fonts
            build/pics
            build/sound
            build/midi
            build/hypinput.ini

      - name: Upload no-console build
        uses: actions/upload-artifact@v6
        with:
          name: hypseus-windows-noconsole
          path: |
            build-noconsole/hypseus.exe
            build-noconsole/*.dll
            build-noconsole/fonts
            build-noconsole/pics
            build-noconsole/sound
            build-noconsole/midi
            build-noconsole/hypinput.ini